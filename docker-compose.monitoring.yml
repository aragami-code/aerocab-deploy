version: '3.9'

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: aerocab_prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - aerocab_net

  grafana:
    image: grafana/grafana:latest
    container_name: aerocab_grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: '${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}'
      GF_SECURITY_ALLOW_EMBEDDING: 'true'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SERVER_ROOT_URL: 'https://graphana.aerogo24.com'
      GF_SERVER_DOMAIN: 'graphana.aerogo24.com'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - aerocab_net

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: aerocab_pg_exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: 'postgresql://${PG_MONITOR_USER:?PG_MONITOR_USER must be set}:${PG_MONITOR_PASSWORD:?PG_MONITOR_PASSWORD must be set}@postgres:5432/aerogo24?sslmode=disable'
    networks:
      - aerocab_net

  redis_exporter:
    image: oliver006/redis_exporter:latest
    container_name: aerocab_redis_exporter
    restart: unless-stopped
    environment:
      REDIS_ADDR: 'redis://redis:6379'
    networks:
      - aerocab_net

  node_exporter:
    image: prom/node-exporter:latest
    container_name: aerocab_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - aerocab_net

networks:
  aerocab_net:
    external: true
    name: aerocab_net

volumes:
  prometheus_data:
  grafana_data:
