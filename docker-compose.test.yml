version: '3.8'
services:
  postgres-test:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: aerocab
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: aerocab_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    ports:
      - '6380:6379'
